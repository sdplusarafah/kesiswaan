<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mengarahkan ke Form SD Plus Arafah...</title>
  <script>
    // 1. Ambil URL Web App Resmi Apps Script (/exec)
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw5vYNYhKJYIDCCUCzhupBJOS9PbiSjdRZBglOrFyqNF76zaVKBpFiko1jpyyrYE6OIfQ/exec";

    // 2. Ambil parameter ID dari URL GitHub (contoh: sdplusarafah.github.io/form?id=270801033)
    const urlParams = new URLSearchParams(window.location.search);
    const idSiswa = urlParams.get('id');

    if (idSiswa) {
      // Direct otomatis ke Apps Script dengan menyertakan parameter page & id
      window.location.href = `${GAS_WEBAPP_URL}?page=form_ortu&id=${encodeURIComponent(idSiswa)}`;
    } else {
      document.write("Tautan tidak valid. ID Siswa tidak ditemukan.");
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    Mohon tunggu, sedang mengarahkan ke Formulir Data Siswa SD Plus Arafah...
  </p>
</body>
</html>
